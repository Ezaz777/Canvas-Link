name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Must match GOOGLE_PLAY_PACKAGE_NAME in backend/wrangler.toml and your Play Console app ID
  ANDROID_PACKAGE_NAME: com.wallpapersync.app

defaults:
  run:
    working-directory: mobile-client

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Recreate & Configure Android Project
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/wallpapersync/app/MainActivity.kt /tmp/backup/MainActivity.kt
          rm -rf android
          flutter create --org com.wallpapersync.app --project-name wallpaper_sync --platforms=android .

          # Clean any com/example template code
          rm -rf android/app/src/main/kotlin/com/example

          # Add ProGuard rules for okhttp3, conscrypt, and Google Play Billing
          cat << 'EOF' > android/app/proguard-rules.pro
          -keepattributes *Annotation*
          -dontwarn org.conscrypt.**
          -dontwarn okhttp3.**
          -keep class com.android.vending.billing.** { *; }
          EOF

          # Ensure NDK 28.2.13676358 is available for native debug symbols in AAB
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          HAS_NDK="false"
          if [ -n "$SDK_ROOT" ]; then
            if [ -d "$SDK_ROOT/ndk/28.2.13676358" ]; then
              HAS_NDK="true"
            elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              if [ -w "$SDK_ROOT" ]; then
                yes | "$SM" --licenses >/dev/null 2>&1 || true
                yes | "$SM" --install "ndk;28.2.13676358" && HAS_NDK="true" || true
              else
                yes | sudo -E "$SM" --licenses >/dev/null 2>&1 || true
                yes | sudo -E "$SM" --install "ndk;28.2.13676358" && HAS_NDK="true" || true
              fi
            fi
          fi
          export HAS_NDK

          # Configure release keystore if GitHub Secrets are present
          HAS_SIGNING="false"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
            cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            HAS_SIGNING="true"
            echo "Release signing configured with upload-keystore.jks"
          else
            echo "::warning::Release keystore secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) not set. Building debug-signed artifacts (Play Console requires release signing)."
          fi
          export HAS_SIGNING

          python3 - << 'PYEOF'
          import os, re
          from pathlib import Path

          pkg = os.environ["ANDROID_PACKAGE_NAME"]
          has_signing = os.environ.get("HAS_SIGNING") == "true"
          has_ndk = os.environ.get("HAS_NDK") == "true"
          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")
          gradle_path = gradle_kts if gradle_kts.exists() else gradle_groovy
          is_kts = gradle_path == gradle_kts
          content = gradle_path.read_text()

          content = re.sub(r'namespace\s*=?\s*"[^"]+"', f'namespace = "{pkg}"', content)
          content = re.sub(r'applicationId\s*=?\s*"[^"]+"', f'applicationId = "{pkg}"', content)
          content = re.sub(r'minSdk(?:Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24', content)
          content = re.sub(r'minSdk(?:Version)?\s*=?\s*(?:16|19|21|22|23)', 'minSdk = 24', content)
          content = re.sub(r'compileSdk(?:Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
          content = re.sub(r'targetSdk(?:Version)?\s*=?\s*flutter\.targetSdkVersion', 'targetSdk = 36', content)

          proguard_line = (
              'proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              if is_kts
              else 'proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
          )
          ndk_block = '\n            ndk {\n                debugSymbolLevel = "SYMBOL_TABLE"\n            }' if (is_kts and has_ndk) else ""
          if proguard_line not in content:
              content = re.sub(
                  r'(release\s*\{)',
                  rf'\1\n            {proguard_line}{ndk_block}',
                  content,
                  count=1
              )

          if has_signing:
              if is_kts:
                  imports = "import java.util.Properties\nimport java.io.FileInputStream\n\n"
                  key_props_loader = (
                      'val keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
                  content = imports + content
                  content = content.replace("android {", key_props_loader + "android {", 1)
                  signing_block = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

              buildTypes {'''
                  content = content.replace("buildTypes {", signing_block, 1)
                  content = re.sub(
                      r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                      'signingConfig = signingConfigs.getByName("release")',
                      content
                  )
              else:
                  key_props_loader = (
                      'def keystoreProperties = new Properties()\n'
                      'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }\n'
                      '}\n\n'
                  )
                  content = content.replace("android {", key_props_loader + "android {", 1)
                  signing_block = '''signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }
              buildTypes {'''
                  content = content.replace("buildTypes {", signing_block, 1)
                  content = re.sub(r'signingConfig\s*=?\s*signingConfigs\.debug', 'signingConfig = signingConfigs.release', content)

          gradle_path.write_text(content)
          print(f"Patched {gradle_path} successfully (has_signing={has_signing}, has_ndk={has_ndk})")
          PYEOF

          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/wallpapersync/app
          cp /tmp/backup/MainActivity.kt android/app/src/main/kotlin/com/wallpapersync/app/MainActivity.kt

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release App Bundle (AAB) & APK
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/PinterestAutoWallpaper.aab
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PinterestAutoWallpaper.apk

      - name: Upload AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PinterestAutoWallpaper-AAB
          path: mobile-client/build/app/outputs/bundle/release/PinterestAutoWallpaper.aab
          compression-level: 0

      - name: Upload APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: PinterestAutoWallpaper-APK
          path: mobile-client/build/app/outputs/flutter-apk/PinterestAutoWallpaper.apk
          compression-level: 0
