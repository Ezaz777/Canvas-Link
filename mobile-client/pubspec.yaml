name: wallpaper_sync
description: Pinterest Auto Wallpaper - Daily Pinterest wallpaper sync for Android
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  workmanager: ^0.10.10
  async_wallpaper: ^3.7.0
  image: ^4.2.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  google_fonts: ^6.2.1
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 24
  image_path: "assets/logo.png"
  adaptive_icon_background: "#E60023"
  adaptive_icon_foreground: "assets/logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_foreground.png
