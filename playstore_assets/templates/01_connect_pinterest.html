<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 50% 12%, #1a080d 0%, #0d0e13 42%, #08080a 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 900px;
    height: 900px;
    top: -240px;
    left: 90px;
    background: radial-gradient(circle, rgba(230, 0, 35, 0.28) 0%, rgba(0,0,0,0) 70%);
    pointer-events: none;
  }
  .header {
    position: absolute;
    top: 70px;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 0 45px;
    z-index: 10;
  }
  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 22px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(230, 0, 35, 0.35);
    border-radius: 30px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #FF5268;
    backdrop-filter: blur(10px);
  }
  .brand-pill img {
    width: 24px;
    height: 24px;
    border-radius: 6px;
  }
  h1 {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -1.2px;
    margin: 20px auto 12px auto;
    max-width: 960px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.65);
  }
  h1 span.highlight {
    background: linear-gradient(135deg, #FF455D 0%, #FF8A9A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.sub {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.35;
    color: #A1A4B5;
    max-width: 860px;
    margin: 0 auto;
  }

  /* Phone Mockup (FHD 9:16 balanced proportion) */
  .phone-wrap {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 660px;
    height: 1360px;
    background: #171821;
    border-radius: 52px;
    padding: 10px;
    box-shadow: 0 35px 90px rgba(0, 0, 0, 0.9), 0 0 50px rgba(230, 0, 35, 0.18);
    border: 2.5px solid rgba(255, 255, 255, 0.18);
  }
  .phone-inner {
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  .app-screenshot {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
</style>
</head>
