<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 2400px;
    background: radial-gradient(circle at 50% 12%, #220910 0%, #111217 40%, #0a0b0e 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Roboto, sans-serif;
    color: #FFFFFF;
    position: relative;
    overflow: hidden;
  }
  .glow-top {
    position: absolute;
    width: 1000px;
    height: 1000px;
    top: -250px;
    left: 40px;
    background: radial-gradient(circle, rgba(230, 0, 35, 0.24) 0%, rgba(230, 0, 35, 0) 70%);
    pointer-events: none;
  }
  .header-container {
    position: absolute;
    top: 130px;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 0 50px;
    z-index: 10;
  }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    border-radius: 40px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FF5268;
    backdrop-filter: blur(10px);
  }
  .brand-badge img {
    width: 26px;
    height: 26px;
    border-radius: 6px;
  }
  h1 {
    font-size: 68px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -1.5px;
    margin: 28px auto 16px auto;
    max-width: 960px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  h1 span.highlight {
    background: linear-gradient(135deg, #FF455D 0%, #FF8A9A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 span.gold {
    background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.subtitle {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.35;
    color: #A3A6B7;
    max-width: 880px;
    margin: 0 auto;
  }

  /* Standard Phone Frame */
  .phone-frame {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 780px;
    height: 1680px;
    background: #1C1E26;
    border-radius: 56px;
    padding: 12px;
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.85), 0 0 70px rgba(230, 0, 35, 0.16);
    border: 3px solid rgba(255, 255, 255, 0.16);
    z-index: 2;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    position: relative;
    overflow: hidden;
  }
  .punch-hole {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 22px;
    background: #000000;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 60;
  }
  .status-bar {
    position: absolute;
    top: 16px;
    left: 36px;
    right: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: 600;
    color: #FFFFFF;
    z-index: 50;
  }
</style>
